<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — NIANE</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="../site.webmanifest">

    <!-- Aplica o tema salvo ANTES do CSS carregar. -->
    <script src="../js/niane-theme-init.js"></script>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <!-- Página aberta pelo link enviado por e-mail ("Esqueci minha senha"). -->
    <div class="auth-card">
        <div class="auth-logo">NI<span>ANE</span></div>
        <h1 class="auth-heading">Redefinir senha</h1>

        <div id="resetCarregando">
            <p class="auth-subtitle">Verificando o link…</p>
        </div>

        <div id="resetInvalido" hidden>
            <p class="auth-subtitle">Este link é inválido ou expirou. Peça um novo em "Esqueci minha senha".</p>
            <div class="auth-footer"><a href="login.html">Voltar ao login</a></div>
        </div>

        <form id="resetForm" hidden>
            <p class="auth-subtitle">Escolha uma nova senha (mínimo de 8 caracteres)</p>
            <div class="field">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" placeholder="••••••••" autocomplete="new-password" required minlength="8">
            </div>
            <div class="field">
                <label for="confirmaSenha">Confirmar nova senha</label>
                <input type="password" id="confirmaSenha" placeholder="••••••••" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="btn-submit">Salvar nova senha</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
